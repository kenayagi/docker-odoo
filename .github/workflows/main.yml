name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
  # Manual run from any branch, to test a build without pushing a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3
      - name: login to the docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Docker tags: a tag push uses the git tag name, a manual run uses the
      # branch name; only a tag push also moves "latest".
      - name: extract metadata (tags, labels) for docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/docker-odoo
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      # no-cache is intentional: the image must always reinstall the latest
      # available package and not reuse stale layers.
      - name: build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          no-cache: true
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
